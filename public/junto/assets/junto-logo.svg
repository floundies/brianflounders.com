<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <style>
      .logo-stroke { stroke: #d4a854; stroke-width: 1.5; fill: none; }
      .logo-fill { fill: #d4a854; }
      .logo-text { fill: #d4a854; font-family: 'Georgia', 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="94" class="logo-stroke" />
  <circle cx="100" cy="100" r="88" class="logo-stroke" stroke-dasharray="2 4" />

  <!-- Top arc text: THE JUNTO -->
  <path id="topArc" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" stroke="none" />
  <text class="logo-text" font-size="13" font-weight="700" letter-spacing="5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">THE JUNTO</textPath>
  </text>

  <!-- Bottom arc text: PHILADELPHIA -->
  <path id="bottomArc" d="M 170,108 A 70,70 0 0,1 30,108" fill="none" stroke="none" />
  <text class="logo-text" font-size="10" letter-spacing="4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">PHILADELPHIA</textPath>
  </text>

  <!-- Separator dots -->
  <circle cx="28" cy="102" r="2.5" class="logo-fill" />
  <circle cx="172" cy="102" r="2.5" class="logo-fill" />

  <!-- Inner content: Quill -->
  <g transform="translate(60, 58)" class="logo-stroke" stroke-width="1.2">
    <!-- Quill shaft -->
    <line x1="0" y1="52" x2="38" y2="8" />
    <!-- Quill feather -->
    <path d="M 36,10 C 42,2 50,-2 54,4 C 48,6 42,12 38,14" />
    <path d="M 36,10 C 32,4 34,-2 40,-4 C 42,0 40,6 38,10" />
    <!-- Quill tip -->
    <line x1="0" y1="52" x2="4" y2="56" />
    <!-- Barb lines -->
    <line x1="30" y1="18" x2="36" y2="14" />
    <line x1="26" y1="22" x2="32" y2="18" />
    <line x1="22" y1="26" x2="28" y2="22" />
  </g>

  <!-- Inner content: Terminal cursor >_ -->
  <g transform="translate(100, 72)" class="logo-fill">
    <!-- > bracket -->
    <polygon points="0,0 14,10 0,20 3,18 14,10 3,2" />
    <!-- _ underscore (blinking cursor) -->
    <rect x="18" y="17" width="16" height="3" rx="1" />
  </g>

  <!-- Connecting line between quill and cursor -->
  <line x1="96" y1="96" x2="104" y2="96" class="logo-stroke" stroke-width="1" stroke-dasharray="2 3" />

</svg>
